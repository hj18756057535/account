<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account Center</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --panel: #ffffff;
            --line: #d7dde8;
            --text: #172033;
            --muted: #647086;
            --brand: #1f7a6d;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        h1 {
            font-size: 20px;
            margin: 0;
        }

        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 20px;
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        a {
            display: block;
            min-height: 138px;
            padding: 20px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            text-decoration: none;
        }

        a:hover {
            border-color: var(--brand);
        }

        h2 {
            margin: 0 0 10px;
            font-size: 17px;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
            font-size: 14px;
        }
    </style>
</head>
<body>
<header>
    <h1>Account Center</h1>
    <span>接口通知 · 应用准入 · iframe 授权</span>
</header>
<main>
    <a href="/users">
        <h2>用户与授权</h2>
        <p>新增账户中心用户，给用户授权应用准入，并打开应用提供的 iframe 权限配置页。</p>
    </a>
    <a href="/applications">
        <h2>应用管理</h2>
        <p>维护内部应用编码、SSO 回调、接口通知地址、iframe 授权页和默认租户。</p>
    </a>
    <a href="/audit-logs">
        <h2>审计日志</h2>
        <p>查看所有管理操作的审计记录，包括用户变更、应用变更、授权操作等。</p>
    </a>
</main>
</body>
</html>
