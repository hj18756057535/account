<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户与授权 - Account Center</title>
    <style>
        :root {
            --bg: #f6f8fb;
            --panel: #ffffff;
            --line: #d7dde8;
            --text: #172033;
            --muted: #647086;
            --brand: #1f7a6d;
            --brand-dark: #155f55;
            --warn: #9a4d14;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Arial, "Microsoft YaHei", sans-serif;
            letter-spacing: 0;
        }

        header {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
        }

        nav {
            display: flex;
            gap: 14px;
        }

        nav a {
            color: var(--brand);
            text-decoration: none;
            font-weight: 700;
        }

        h1 {
            font-size: 20px;
            margin: 0;
        }

        main {
            display: grid;
            grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
            gap: 20px;
            padding: 20px;
        }

        section {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
        }

        h2 {
            font-size: 15px;
            margin: 0 0 14px;
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 12px;
            margin: 12px 0 6px;
        }

        input {
            width: 100%;
            min-height: 36px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 8px 10px;
            color: var(--text);
            background: #fff;
        }

        button {
            min-height: 36px;
            border: 0;
            border-radius: 6px;
            padding: 0 12px;
            background: var(--brand);
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        button:hover {
            background: var(--brand-dark);
        }

        .stack {
            display: grid;
            gap: 16px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .status {
            min-height: 42px;
            margin-top: 16px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--muted);
            background: #fbfcff;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .workspace {
            min-height: calc(100vh - 104px);
            display: grid;
            grid-template-rows: auto minmax(360px, 1fr);
            gap: 14px;
        }

        iframe {
            width: 100%;
            height: 100%;
            min-height: 360px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }

        .note {
            color: var(--warn);
            font-size: 13px;
            line-height: 1.6;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
<header>
    <h1>用户与授权</h1>
    <nav>
        <a href="/">首页</a>
        <a href="/applications">应用管理</a>
    </nav>
</header>
<main>
    <div class="stack">
        <section>
            <h2>用户</h2>
            <label for="account">账号</label>
            <input id="account" value="zhangsan">
            <label for="email">邮箱</label>
            <input id="email" value="zhangsan@example.com">
            <label for="name">姓名</label>
            <input id="name" value="张三">
            <label for="phone">手机</label>
            <input id="phone" value="13800000000">
            <div class="actions">
                <button id="createUser">新增用户</button>
            </div>
        </section>
        <section>
            <h2>应用准入授权</h2>
            <label for="userId">用户 ID</label>
            <input id="userId">
            <label for="appCode">应用编码</label>
            <input id="appCode" value="cms-ai">
            <label for="permissionUrl">iframe 授权页地址</label>
            <input id="permissionUrl" value="http://localhost:9003/account-admin/users/{externalUserId}/permissions">
            <div class="actions">
                <button id="authorize">授权应用</button>
                <button id="deauthorize">取消授权</button>
                <button id="issueTicket">生成 SSO Code</button>
                <button id="openIframe">打开 iframe</button>
            </div>
            <div id="status" class="status"></div>
        </section>
    </div>
    <section class="workspace">
        <div>
            <h2>应用内权限配置</h2>
            <div class="note">iframe 页面由目标应用提供；Account Center 只负责应用准入、用户上下文和管理入口。</div>
        </div>
        <iframe id="permissionFrame" title="application permission iframe"></iframe>
    </section>
</main>
<script>
    const statusBox = document.getElementById('status');
    const value = (id) => document.getElementById(id).value;
    const setStatus = (message) => statusBox.textContent = message;

    async function postJson(url, body) {
        const response = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(body || {})
        });
        if (!response.ok) {
            throw new Error(await response.text() || response.statusText);
        }
        const text = await response.text();
        return text ? JSON.parse(text) : null;
    }

    document.getElementById('createUser').onclick = async () => {
        try {
            const user = await postJson('/api/users', {
                account: value('account'),
                email: value('email'),
                name: value('name'),
                phone: value('phone')
            });
            document.getElementById('userId').value = user.id;
            setStatus('用户已创建：' + JSON.stringify(user, null, 2));
        } catch (error) {
            setStatus(error.message);
        }
    };

    document.getElementById('authorize').onclick = async () => {
        try {
            await postJson('/api/users/' + encodeURIComponent(value('userId')) + '/applications/' + encodeURIComponent(value('appCode')) + '/authorize');
            setStatus('应用准入授权已完成');
        } catch (error) {
            setStatus(error.message);
        }
    };

    document.getElementById('deauthorize').onclick = async () => {
        try {
            await postJson('/api/users/' + encodeURIComponent(value('userId')) + '/applications/' + encodeURIComponent(value('appCode')) + '/deauthorize');
            setStatus('应用准入授权已取消');
        } catch (error) {
            setStatus(error.message);
        }
    };

    document.getElementById('issueTicket').onclick = async () => {
        try {
            const ticket = await postJson('/api/sso/tickets', {
                userId: value('userId'),
                appCode: value('appCode')
            });
            setStatus('SSO Code：' + ticket.code);
        } catch (error) {
            setStatus(error.message);
        }
    };

    document.getElementById('openIframe').onclick = () => {
        const url = value('permissionUrl')
            .replace('{externalUserId}', encodeURIComponent(value('userId')))
            + '?ticket=preview';
        document.getElementById('permissionFrame').src = url;
        setStatus('iframe 已指向：' + url);
    };
</script>
</body>
</html>
