<!doctype html>
<html lang="zh-CN" th:lang="${pageLanguage}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${page.errorTitle}">Account Center</title>
    <style>
        :root{--bg:#f6f8fb;--panel:#fff;--line:#d7dde8;--text:#172033;--muted:#647086;--brand:#1f7a6d;--danger:#c0392b}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .error-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;text-align:center;max-width:400px}
        h1{font-size:18px;color:var(--danger);margin:0 0 12px}
        p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px}
        a{color:var(--brand);text-decoration:none;font-weight:700}
    </style>
</head>
<body>
<div class="error-box">
    <h1 th:text="${page.authorizationFailed}"></h1>
    <p id="message" th:text="${message}"></p>
    <a href="/" th:text="${page.backHome}"></a>
</div>
</body>
</html>
