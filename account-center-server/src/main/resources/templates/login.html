<!doctype html>
<html lang="zh-CN" th:lang="${pageLanguage}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${page.loginTitle}">Account Center</title>
    <style>
        :root{--bg:#f6f8fb;--panel:#fff;--line:#d7dde8;--text:#172033;--muted:#647086;--brand:#1f7a6d;--brand-dark:#155f55;--danger:#c0392b}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
        .login-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;width:360px;max-width:90vw}
        h1{font-size:20px;margin:0 0 24px;text-align:center}
        label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
        input{width:100%;min-height:38px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:14px}
        input:focus{outline:none;border-color:var(--brand)}
        button{width:100%;min-height:40px;border:0;border-radius:6px;background:var(--brand);color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:20px}
        button:hover{background:var(--brand-dark)}
        .error{color:var(--danger);font-size:13px;text-align:center;margin-top:12px;min-height:20px}
    </style>
</head>
<body>
<div class="login-box">
    <h1>Account Center</h1>
    <form method="post" action="/login">
        <label for="account" th:text="${page.account}"></label>
        <input id="account" name="account" type="text" required autofocus>
        <label for="password" th:text="${page.password}"></label>
        <input id="password" name="password" type="password" required>
        <button type="submit" th:text="${page.signIn}"></button>
    </form>
    <div class="error" id="errorMsg" th:text="${error}"></div>
</div>
</body>
</html>
