<!doctype html>
<html lang="zh-CN" th:lang="${pageLanguage}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${page.loginTitle}">Account Center</title>
    <style>
        :root{--bg:#f5f6f8;--panel:#fff;--line:#dee2e8;--text:#172033;--muted:#5d6b85;--brand:#2563eb;--brand-dark:#1d4ed8;--danger:#b42318}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
        .login-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:400px;max-width:100%;box-shadow:0 12px 36px #17203308}
        .brand{color:var(--muted);font-size:14px;font-weight:600;margin:0 0 12px}
        h1{font-size:24px;margin:0 0 24px}
        label{display:block;color:var(--muted);font-size:13px;margin:14px 0 6px}
        input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);color:var(--text);font:inherit;font-size:14px}
        input:focus{outline:3px solid #2563eb1f;border-color:var(--brand)}
        button{width:100%;min-height:44px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;margin-top:24px}
        button:hover{background:var(--brand-dark)}
        button:focus-visible{outline:3px solid #2563eb4d;outline-offset:3px}
        .error{color:var(--danger);font-size:13px;text-align:center;margin-top:12px;min-height:20px}
    </style>
</head>
<body>
<main class="login-box">
    <p class="brand">Account Center</p>
    <h1 th:text="${page.signIn}">登录</h1>
    <form method="post" action="/login">
        <input th:if="${_csrf != null}" type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label for="account" th:text="${page.account}"></label>
        <input id="account" name="account" type="text" autocomplete="username" required autofocus>
        <label for="password" th:text="${page.password}"></label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit" th:text="${page.signIn}"></button>
    </form>
    <div class="error" id="errorMsg" role="alert" th:text="${error}"></div>
</main>
</body>
</html>
