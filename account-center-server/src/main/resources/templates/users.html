<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户与授权 - Account Center</title>
    <style>
        :root{--bg:#f6f8fb;--panel:#fff;--line:#d7dde8;--text:#172033;--muted:#647086;--brand:#1f7a6d;--brand-dark:#155f55;--danger:#c0392b;--danger-bg:#fdf0ef;--success:#1a8c6e;--warn:#9a4d14}
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft YaHei",sans-serif}
        header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel)}
        nav{display:flex;gap:14px}nav a{color:var(--brand);text-decoration:none;font-weight:700;font-size:14px}
        h1{font-size:18px;margin:0}
        main{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px;padding:16px;height:calc(100vh - 56px)}
        section{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto}
        h2{font-size:14px;margin:0 0 10px}
        label{display:block;color:var(--muted);font-size:12px;margin:8px 0 4px}
        input,select{width:100%;min-height:32px;border:1px solid var(--line);border-radius:4px;padding:6px 8px;color:var(--text);background:#fff;font-size:13px}
        button{min-height:32px;border:0;border-radius:4px;padding:0 12px;background:var(--brand);color:#fff;cursor:pointer;font-weight:700;font-size:13px}
        button:hover{background:var(--brand-dark)}
        button.danger{background:var(--danger)}
        button.secondary{background:var(--muted)}
        .actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
        .status{min-height:36px;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:#fbfcff;white-space:pre-wrap;word-break:break-word;font-size:12px}
        .search-bar{display:flex;gap:8px;margin-bottom:10px}
        .search-bar input{flex:1}
        table{width:100%;border-collapse:collapse;font-size:13px}
        th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
        th{color:var(--muted);font-weight:600;font-size:12px;background:#f8f9fb}
        tr:hover{background:#f0f7f6}
        tr.active{background:#e6f3f1}
        .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
        .badge.enabled{background:#e6f7f0;color:#1a8c6e}
        .badge.disabled{background:var(--danger-bg);color:var(--danger)}
        .right-panel{display:grid;grid-template-rows:auto 1fr;gap:12px}
        .workspace{display:grid;grid-template-rows:auto 1fr;gap:8px;min-height:0}
        iframe{width:100%;height:100%;min-height:300px;border:1px solid var(--line);border-radius:6px;background:#fff}
        .note{color:var(--warn);font-size:12px;line-height:1.5}
        .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
        .tabs{display:flex;gap:0;margin-bottom:10px}
        .tabs button{border-radius:0;border:1px solid var(--line);background:var(--panel);color:var(--text);font-weight:400}
        .tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
        .edit-form{display:none}.edit-form.show{display:block}
        @media(max-width:900px){main{grid-template-columns:1fr;height:auto}}
    </style>
</head>
<body>
<header>
    <h1>用户与授权</h1>
    <nav><a href="/">首页</a><a href="/applications">应用管理</a></nav>
</header>
<main>
    <div>
        <section>
            <div class="section-title">
                <h2>用户列表</h2>
                <button onclick="showCreateForm()">+ 新增</button>
            </div>
            <div class="search-bar">
                <input id="searchKeyword" placeholder="搜索账号/姓名/邮箱/手机" onkeyup="searchUsers()">
                <select id="searchStatus" onchange="searchUsers()">
                    <option value="">全部状态</option>
                    <option value="enabled">启用</option>
                    <option value="disabled">禁用</option>
                </select>
            </div>
            <table>
                <thead><tr><th>账号</th><th>姓名</th><th>状态</th></tr></thead>
                <tbody id="userTable"></tbody>
            </table>
        </section>
        <section class="edit-form" id="editSection">
            <h2 id="editTitle">新增用户</h2>
            <input type="hidden" id="editUserId">
            <label>账号</label><input id="editAccount">
            <label>邮箱</label><input id="editEmail">
            <label>姓名</label><input id="editName">
            <label>手机</label><input id="editPhone">
            <div class="actions">
                <button onclick="saveUser()">保存</button>
                <button class="secondary" onclick="hideEditForm()">取消</button>
            </div>
            <div id="editStatus" class="status"></div>
        </section>
    </div>
    <div class="right-panel">
        <section>
            <h2 id="authTitle">应用准入授权</h2>
            <div id="authContent">
                <p style="color:var(--muted);font-size:13px">请从左侧选择一个用户</p>
            </div>
            <div id="authStatus" class="status" style="display:none"></div>
        </section>
        <section class="workspace">
            <div>
                <h2>应用内权限配置</h2>
                <div class="note">iframe 页面由目标应用提供；Account Center 只负责应用准入、用户上下文和管理入口。</div>
            </div>
            <iframe id="permissionFrame" title="application permission iframe"></iframe>
        </section>
    </div>
</main>
<script>
    let selectedUserId = null;
    let applications = [];

    const api = {
        async get(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); },
        async post(url, body) { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})}); if (!r.ok) throw new Error(await r.text()); const t = await r.text(); return t ? JSON.parse(t) : null; },
        async put(url, body) { const r = await fetch(url, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); if (!r.ok) throw new Error(await r.text()); return r.json(); }
    };

    async function searchUsers() {
        const keyword = document.getElementById('searchKeyword').value;
        const status = document.getElementById('searchStatus').value;
        let url = '/api/users?';
        if (keyword) url += 'keyword=' + encodeURIComponent(keyword) + '&';
        if (status) url += 'status=' + encodeURIComponent(status);
        try {
            const users = await api.get(url);
            const tbody = document.getElementById('userTable');
            tbody.innerHTML = users.map(u =>
                '<tr class="' + (u.id === selectedUserId ? 'active' : '') + '" onclick="selectUser(\'' + u.id + '\')" style="cursor:pointer">' +
                '<td>' + u.account + '</td><td>' + u.name + '</td>' +
                '<td><span class="badge ' + u.status + '">' + (u.status === 'enabled' ? '启用' : '禁用') + '</span></td></tr>'
            ).join('');
        } catch(e) { console.error(e); }
    }

    async function loadApplications() {
        try { applications = await api.get('/api/applications'); } catch(e) { applications = []; }
    }

    async function selectUser(userId) {
        selectedUserId = userId;
        searchUsers();
        try {
            const user = await api.get('/api/users/' + userId);
            const apps = await api.get('/api/users/' + userId + '/applications');
            document.getElementById('authTitle').textContent = '授权管理 - ' + user.account + ' (' + user.name + ')';
            let html = '<div style="margin-bottom:10px">';
            html += '<span class="badge ' + user.status + '">' + (user.status === 'enabled' ? '启用' : '禁用') + '</span> ';
            if (user.status === 'enabled') {
                html += '<button class="danger" onclick="disableUser()" style="font-size:12px;padding:0 8px;min-height:24px">禁用</button>';
            } else {
                html += '<button onclick="enableUser()" style="font-size:12px;padding:0 8px;min-height:24px;background:var(--success)">启用</button>';
            }
            html += '</div>';
            html += '<label>授权新应用</label><div style="display:flex;gap:8px"><select id="appSelect" style="flex:1">';
            html += '<option value="">选择应用...</option>';
            const authorizedCodes = apps.map(a => a.appCode);
            applications.filter(a => !authorizedCodes.includes(a.appCode)).forEach(a => {
                html += '<option value="' + a.appCode + '">' + a.name + ' (' + a.appCode + ')</option>';
            });
            html += '</select><button onclick="authorizeApp()" style="font-size:12px">授权</button></div>';
            if (apps.length > 0) {
                html += '<label>已授权应用</label><table><thead><tr><th>编码</th><th>名称</th><th>操作</th></tr></thead><tbody>';
                apps.forEach(a => {
                    html += '<tr><td>' + a.appCode + '</td><td>' + a.name + '</td>';
                    html += '<td><button class="danger" style="font-size:11px;padding:0 6px;min-height:24px" onclick="deauthorizeApp(\'' + a.appCode + '\')">取消授权</button> ';
                    html += '<button style="font-size:11px;padding:0 6px;min-height:24px" onclick="issueTicket(\'' + a.appCode + '\')">SSO Code</button> ';
                    html += '<button class="secondary" style="font-size:11px;padding:0 6px;min-height:24px" onclick="openIframe(\'' + a.appCode + '\')">iframe</button></td></tr>';
                });
                html += '</tbody></table>';
            }
            document.getElementById('authContent').innerHTML = html;
        } catch(e) { document.getElementById('authContent').innerHTML = '<p style="color:var(--danger)">' + e.message + '</p>'; }
    }

    function showCreateForm() {
        selectedUserId = null;
        document.getElementById('editTitle').textContent = '新增用户';
        document.getElementById('editUserId').value = '';
        document.getElementById('editAccount').value = '';
        document.getElementById('editEmail').value = '';
        document.getElementById('editName').value = '';
        document.getElementById('editPhone').value = '';
        document.getElementById('editStatus').textContent = '';
        document.getElementById('editSection').classList.add('show');
    }

    async function showEditForm(userId) {
        try {
            const user = await api.get('/api/users/' + userId);
            document.getElementById('editTitle').textContent = '编辑用户';
            document.getElementById('editUserId').value = userId;
            document.getElementById('editAccount').value = user.account;
            document.getElementById('editEmail').value = user.email;
            document.getElementById('editName').value = user.name;
            document.getElementById('editPhone').value = user.phone;
            document.getElementById('editStatus').textContent = '';
            document.getElementById('editSection').classList.add('show');
        } catch(e) { alert(e.message); }
    }

    function hideEditForm() { document.getElementById('editSection').classList.remove('show'); }

    async function saveUser() {
        const userId = document.getElementById('editUserId').value;
        const body = {
            account: document.getElementById('editAccount').value,
            email: document.getElementById('editEmail').value,
            name: document.getElementById('editName').value,
            phone: document.getElementById('editPhone').value
        };
        try {
            const user = userId ? await api.put('/api/users/' + userId, body) : await api.post('/api/users', body);
            document.getElementById('editStatus').textContent = '保存成功：' + user.account + ' (ID: ' + user.id + ')';
            searchUsers();
        } catch(e) { document.getElementById('editStatus').textContent = '错误：' + e.message; }
    }

    async function enableUser() {
        if (!selectedUserId) return;
        try { await api.post('/api/users/' + selectedUserId + '/enable'); selectUser(selectedUserId); searchUsers(); }
        catch(e) { showAuthStatus(e.message); }
    }

    async function disableUser() {
        if (!selectedUserId || !confirm('确定禁用该用户？禁用后将通知所有已授权应用。')) return;
        try { await api.post('/api/users/' + selectedUserId + '/disable'); selectUser(selectedUserId); searchUsers(); }
        catch(e) { showAuthStatus(e.message); }
    }

    async function authorizeApp() {
        const appCode = document.getElementById('appSelect').value;
        if (!appCode || !selectedUserId) return;
        try { await api.post('/api/users/' + selectedUserId + '/applications/' + encodeURIComponent(appCode) + '/authorize'); showAuthStatus('授权成功'); selectUser(selectedUserId); }
        catch(e) { showAuthStatus(e.message); }
    }

    async function deauthorizeApp(appCode) {
        if (!selectedUserId || !confirm('确定取消授权？')) return;
        try { await api.post('/api/users/' + selectedUserId + '/applications/' + encodeURIComponent(appCode) + '/deauthorize'); showAuthStatus('取消授权成功'); selectUser(selectedUserId); }
        catch(e) { showAuthStatus(e.message); }
    }

    async function issueTicket(appCode) {
        if (!selectedUserId) return;
        try {
            const ticket = await api.post('/api/sso/tickets', {userId: selectedUserId, appCode: appCode});
            showAuthStatus('SSO Code：' + ticket.code);
        } catch(e) { showAuthStatus(e.message); }
    }

    async function openIframe(appCode) {
        if (!selectedUserId) return;
        try {
            const app = await api.get('/api/applications/' + encodeURIComponent(appCode));
            // 通过 API 签发短期管理 ticket（60 秒有效期，一次性使用）
            const ticket = await api.post('/api/admin-tickets', {
                appCode: appCode,
                userId: selectedUserId,
                purpose: 'iframe-permission'
            });
            const url = app.permissionIframeUrl.replace('{externalUserId}', encodeURIComponent(selectedUserId)) + '?ticket=' + ticket.code;
            document.getElementById('permissionFrame').src = url;
            showAuthStatus('iframe 已指向（ticket 60 秒有效）：' + url);
        } catch(e) { showAuthStatus(e.message); }
    }

    function showAuthStatus(msg) {
        const el = document.getElementById('authStatus');
        el.textContent = msg;
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 5000);
    }

    (async function init() { await loadApplications(); await searchUsers(); })();
</script>
</body>
</html>
