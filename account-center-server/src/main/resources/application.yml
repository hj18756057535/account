server:
  port: 8088
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${ACCOUNT_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: account-center
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://10.6.3.14:5432/account_center}
    username: ${ACCOUNT_DB_USERNAME:cms_db_admin}
    password: ${ACCOUNT_DB_PASSWORD:Ky5eanHuZ+SUqm4KHIuq84fTC9AhkDm0+ErQ=Aa9}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

account:
  console-api:
    enabled: true
  store:
    type: mybatis
  # CMS 本机 OIDC 联调样例，绑定到 OidcProperties。
  # 填好签名文件配置后，将 enabled 改为 true；应用凭据由管理页面维护。
  oidc:
    enabled: true
    issuer: http://localhost:8088
    allow-intranet-http: false
    # 从 account 后端仓库根目录启动，可复用本机已生成的签名文件。
    key-store: file:./.local/oidc/signing.p12
    key-store-password: "HZCCf5-JMPa-ZX1WtqMpyMCe9ZJEE_vVWiPRriEtSgg"
    signing-key-alias: account-signing
    code-ttl: 60s
    access-token-ttl: 5m
    # 客户端摘要保留完整的 {bcrypt} 前缀；CMS bootstrap 填写对应密钥的原始值。
    # 应用与 Secret 统一由管理页面登记，无需在此配置 clients。
