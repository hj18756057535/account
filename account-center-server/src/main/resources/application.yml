server:
  port: 8088
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${ACCOUNT_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: account-center
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${ACCOUNT_DB_URL:jdbc:postgresql://10.6.3.14:5432/account_center}
    username: ${ACCOUNT_DB_USERNAME:postgres}
    password: ${ACCOUNT_DB_PASSWORD:My>i*OWT920y]C1[}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

account:
  console-api:
    enabled: true
  store:
    type: mybatis
  sync:
    type: http
