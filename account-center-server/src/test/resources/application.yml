spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:account_center_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

account:
  store:
    type: mybatis
  sync:
    type: noop
