openapi: 3.1.0
info:
  title: Account Center Management API
  version: 1.0.0
  description: >-
    Account 管理端同源 Session API。浏览器不得持有应用 Secret、Session ID 或长期 Token。
servers:
  - url: /
tags:
  - name: Session
  - name: Users
  - name: Applications
  - name: ApplicationAccess
  - name: Integration
paths:
  /api/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: 初始化或读取当前管理会话
      responses:
        '200':
          description: 当前会话；未登录时 authenticated 为 false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
    post:
      tags: [Session]
      operationId: login
      summary: 使用 Account 管理身份登录
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，服务端轮换 Session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Session]
      operationId: logout
      summary: 退出并使当前 Session 失效
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已退出
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询全局用户
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          description: 匹配账号、姓名、邮箱或手机号
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - createdAt,asc
              - createdAt,desc
              - account,asc
              - account,desc
              - name,asc
              - name,desc
            default: createdAt,desc
      responses:
        '200':
          description: 稳定分页结果；相同排序值始终以 id 升序作为次级排序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建全局用户
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户已创建；重复幂等请求复用首次响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: 查询全局用户详情
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: 用户详情；不含密码、角色、应用 Secret 和内部审计字段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      operationId: updateUser
      summary: 修改全局用户基本资料
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 修改后的用户；版本单调递增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/users/{userId}/status:
    put:
      tags: [Users]
      operationId: changeUserStatus
      summary: 启用或禁用全局用户
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserStatusRequest'
      responses:
        '200':
          description: 状态已更新；不会在本切片触发业务系统同步
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: 查询已登记应用
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: 应用列表，任何响应均不包含 Secret
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Applications]
      operationId: createApplication
      summary: 登记应用并生成首个 Secret
      description: >-
        Secret 仅在首次成功响应中显示。相同幂等键重放不会再次显示 Secret，返回 409；
        调用方遗失后必须执行轮换。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: 应用已登记，Secret 只在本响应中显示
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSecretResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}:
    get:
      tags: [Applications]
      operationId: getApplication
      summary: 查询应用详情
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
      responses:
        '200':
          description: 应用详情，不含 Secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Applications]
      operationId: updateApplication
      summary: 更新应用配置
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: 更新后的应用，version 单调递增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}/status:
    put:
      tags: [Applications]
      operationId: changeApplicationStatus
      summary: 启用或禁用应用
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeApplicationStatusRequest'
      responses:
        '200':
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}/secret/rotate:
    post:
      tags: [Applications]
      operationId: rotateApplicationSecret
      summary: 轮换应用 Secret
      description: 新 Secret 仅显示一次，幂等重放不会再次返回敏感结果。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedReasonRequest'
      responses:
        '200':
          description: Secret 已轮换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSecretResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}/secret/revoke:
    post:
      tags: [Applications]
      operationId: revokeApplicationSecret
      summary: 撤销应用 Secret
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedReasonRequest'
      responses:
        '200':
          description: Secret 已撤销，后续签名请求将被拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/{userId}/application-access:
    get:
      tags: [ApplicationAccess]
      operationId: listUserApplicationAccess
      summary: 查询用户对所有应用的准入期望状态
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 未配置应用以 disabled、version=0 返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationAccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/{userId}/application-access/{appCode}:
    put:
      tags: [ApplicationAccess]
      operationId: changeUserApplicationAccess
      summary: 修改用户准入期望状态
      description: >-
        当前只持久化期望状态和待投递命令，不启动 Outbox Worker；
        integrationStatus 固定为 pending_application_adaptation。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeApplicationAccessRequest'
      responses:
        '202':
          description: 期望状态已保存，业务应用仍待适配
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /openapi/sso/tickets/exchange:
    post:
      tags: [Integration]
      operationId: exchangeSsoTicket
      summary: 业务系统使用一次性 Code 兑换 Account 用户快照
      parameters:
        - $ref: '#/components/parameters/IntegrationAppCode'
        - $ref: '#/components/parameters/IntegrationTimestamp'
        - $ref: '#/components/parameters/IntegrationNonce'
        - $ref: '#/components/parameters/IntegrationSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoTicketExchangeRequest'
      responses:
        '200':
          description: Ticket 已原子消费
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoTicketExchangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /openapi/admin-tickets/verify:
    post:
      tags: [Integration]
      operationId: verifyAdminTicket
      summary: 业务系统验证一次性管理 Ticket
      parameters:
        - $ref: '#/components/parameters/IntegrationAppCode'
        - $ref: '#/components/parameters/IntegrationTimestamp'
        - $ref: '#/components/parameters/IntegrationNonce'
        - $ref: '#/components/parameters/IntegrationSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTicketVerifyRequest'
      responses:
        '200':
          description: Ticket 已验证并原子消费
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicketVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    IntegrationAppCode:
      name: X-Account-App-Code
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IntegrationTimestamp:
      name: X-Account-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    IntegrationNonce:
      name: X-Account-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    IntegrationSignature:
      name: X-Account-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
      description: 由 GET /api/session 初始化并只保存在前端内存中的同步器 Token
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 按操作者、方法和规范化资源路径隔离，完成结果至少保留 24 小时
    AppCode:
      name: appCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    Unauthorized:
      description: 未登录或 Session 已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF 校验失败或当前角色没有访问能力
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: 请求字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 账号重复、资源版本冲突或幂等键冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, user, roles, capabilities, csrfToken]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ACCOUNT_ADMIN, ACCOUNT_AUDITOR]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - 'users:read'
              - 'users:write'
              - 'applications:read'
              - 'applications:write'
              - 'application-access:read'
              - 'application-access:write'
        csrfToken:
          type: string
          minLength: 32
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, account, name]
      properties:
        id:
          type: string
        account:
          type: string
        name:
          type: string
    UserStatus:
      type: string
      enum: [enabled, disabled]
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, account, email, name, phone, status, version]
      properties:
        id:
          type: string
          maxLength: 64
        account:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [account, email, name, phone]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          type: string
          minLength: 1
          maxLength: 64
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [account, email, name, phone, version]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: integer
          format: int64
          minimum: 1
    ChangeUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status, version, reason]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 256
    UserPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    ApplicationStatus:
      type: string
      enum: [enabled, disabled]
    ApplicationProtocolCapability:
      type: string
      enum: [sso, admin_ticket, user_sync]
    ApplicationSecretState:
      type: string
      enum: [active, revoked]
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - appCode
        - name
        - entryUrl
        - ssoCallbackUrl
        - permissionIframeUrl
        - notifyBaseUrl
        - protocolCapabilities
      properties:
        appCode:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 128
        entryUrl:
          type: string
          format: uri
          maxLength: 512
        ssoCallbackUrl:
          type: string
          format: uri
          maxLength: 512
          description: 精确回调 URI，不接受通配符或 fragment
        permissionIframeUrl:
          type: string
          maxLength: 512
          description: 精确授权页 URI，可包含 {externalUserId} 路径占位符
        notifyBaseUrl:
          type: string
          format: uri
          maxLength: 512
        defaultTenantCode:
          type: [string, 'null']
          maxLength: 64
        protocolCapabilities:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationProtocolCapability'
    UpdateApplicationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CreateApplicationFields'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 1
    CreateApplicationFields:
      type: object
      required:
        - name
        - entryUrl
        - ssoCallbackUrl
        - permissionIframeUrl
        - notifyBaseUrl
        - protocolCapabilities
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        entryUrl:
          type: string
          format: uri
          maxLength: 512
        ssoCallbackUrl:
          type: string
          format: uri
          maxLength: 512
        permissionIframeUrl:
          type: string
