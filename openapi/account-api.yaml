openapi: 3.1.0
info:
  title: Account Center Management API
  version: 1.0.0
  description: >-
    Account 管理端同源 Session API。浏览器不得持有应用 Secret、Session ID 或长期 Token。
    管理端 message/fieldErrors 根据可选 Accept-Language 返回中文或英文；支持 zh/en 地区变体与权重，
    缺失、不支持或非法头回退 zh-CN。响应包含 Content-Language 和 Vary: Accept-Language。
    错误码、字段名、状态值及用户业务数据不随语言变化。
    服务端旧票据和签名接口的拒绝响应使用本地化 error 字段；框架错误保留 HTTP 状态和必要响应头，
    不回显异常内部消息。登录与 SSO 页面也按请求语言渲染；语言头不参与签名原文或幂等摘要。
servers:
  - url: /
tags:
  - name: Session
  - name: Users
  - name: Applications
  - name: ApplicationAccess
  - name: Integration
  - name: Audit
paths:
  /api/user-imports/template:
    get:
      tags: [Users]
      operationId: downloadUserImportTemplate
      security:
        - sessionCookie: []
      summary: 下载用户导入模板
      description: >-
        默认启用，仅管理员可用；可设置 account.user-import.enabled=false 关闭。所有响应 no-store。
        .xlsx 上限 5 MiB、1000 条，四列文本 account/email/name/phone。
        预览 15 分钟，结果保留 24 小时；重复账号不覆盖，提交全成或全败。
      responses:
        '200':
          description: XLSX 文本列模板
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '410':
          description: 预览或结果已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: 文件或解压内容超过限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/user-imports/preview:
    post:
      tags: [Users]
      operationId: previewUserImport
      security:
        - sessionCookie: []
      summary: 上传并预览用户导入
      description: >-
        默认启用，仅管理员可用；可设置 account.user-import.enabled=false 关闭。所有响应 no-store。
        .xlsx 上限 5 MiB、1000 条，四列文本 account/email/name/phone。
        预览 15 分钟，结果保留 24 小时；重复账号不覆盖，提交全成或全败。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: 校验预览，业务错误通过 valid 和 rows.errors 返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserImportPreview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '410':
          description: 预览或结果已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: 文件或解压内容超过限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/user-imports/{importId}:
    get:
      tags: [Users]
      operationId: getUserImport
      security:
        - sessionCookie: []
      summary: 读取本人导入预览
      description: >-
        默认启用，仅管理员可用；可设置 account.user-import.enabled=false 关闭。所有响应 no-store。
        .xlsx 上限 5 MiB、1000 条，四列文本 account/email/name/phone。
        预览 15 分钟，结果保留 24 小时；重复账号不覆盖，提交全成或全败。
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 当前预览；已提交时 rows 为空
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserImportPreview' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '410':
          description: 预览或结果已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: 文件或解压内容超过限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/user-imports/{importId}/commit:
    post:
      tags: [Users]
      operationId: commitUserImport
      security:
        - sessionCookie: []
      summary: 整批确认导入
      description: >-
        默认启用，仅管理员可用；可设置 account.user-import.enabled=false 关闭。所有响应 no-store。
        .xlsx 上限 5 MiB、1000 条，四列文本 account/email/name/phone。
        预览 15 分钟，结果保留 24 小时；重复账号不覆盖，提交全成或全败。
      parameters:
        - name: importId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 导入结果，同批次重复提交不重复创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserImportResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '410':
          description: 预览或结果已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: 文件或解压内容超过限制
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: 初始化或读取当前管理会话
      responses:
        '200':
          description: 当前会话；未登录时 authenticated 为 false
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
    post:
      tags: [Session]
      operationId: login
      summary: 使用 Account 管理身份登录
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功，服务端轮换 Session ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [Session]
      operationId: logout
      summary: 退出并使当前 Session 失效
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已退出
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: 分页查询全局用户
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          description: 匹配账号、姓名、邮箱或手机号
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/UserStatus'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - createdAt,asc
              - createdAt,desc
              - account,asc
              - account,desc
              - name,asc
              - name,desc
            default: createdAt,desc
      responses:
        '200':
          description: 稳定分页结果；相同排序值始终以 id 升序作为次级排序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Users]
      operationId: createUser
      summary: 创建全局用户
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: 用户已创建；重复幂等请求复用首次响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: 查询全局用户详情
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '200':
          description: 用户详情；不含密码、角色、应用 Secret 和内部审计字段
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      operationId: updateUser
      summary: 修改全局用户基本资料
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: 修改后的用户；版本单调递增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/users/{userId}/status:
    put:
      tags: [Users]
      operationId: changeUserStatus
      summary: 启用或禁用全局用户
      security:
        - sessionCookie: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserStatusRequest'
      responses:
        '200':
          description: 状态已更新；不会在本切片触发业务系统同步
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications:
    get:
      tags: [Applications]
      operationId: listApplications
      summary: 查询已登记应用
      security:
        - sessionCookie: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ApplicationStatus'
      responses:
        '200':
          description: 应用列表，任何响应均不包含 Secret
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags: [Applications]
      operationId: createApplication
      summary: 登记应用并生成首个 Secret
      description: >-
        Secret 仅在首次成功响应中显示。相同幂等键重放不会再次显示 Secret，返回 409；
        调用方遗失后必须执行轮换。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: 应用已登记，Secret 只在本响应中显示
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSecretResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}:
    get:
      tags: [Applications]
      operationId: getApplication
      summary: 查询应用详情
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
      responses:
        '200':
          description: 应用详情，不含 Secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Applications]
      operationId: updateApplication
      summary: 更新应用配置
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: 更新后的应用，version 单调递增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}/status:
    put:
      tags: [Applications]
      operationId: changeApplicationStatus
      summary: 启用或禁用应用
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeApplicationStatusRequest'
      responses:
        '200':
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}/secret/rotate:
    post:
      tags: [Applications]
      operationId: rotateApplicationSecret
      summary: 轮换应用 Secret
      description: 新 Secret 仅显示一次，幂等重放不会再次返回敏感结果。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedReasonRequest'
      responses:
        '200':
          description: Secret 已轮换
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationSecretResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/applications/{appCode}/secret/revoke:
    post:
      tags: [Applications]
      operationId: revokeApplicationSecret
      summary: 撤销应用 Secret
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionedReasonRequest'
      responses:
        '200':
          description: Secret 已撤销，后续签名请求将被拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/users/{userId}/application-access:
    get:
      tags: [ApplicationAccess]
      operationId: listUserApplicationAccess
      summary: 查询用户对所有应用的准入期望状态
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: 未配置应用以 disabled、version=0 返回
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationAccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/users/{userId}/application-access/{appCode}:
    put:
      tags: [ApplicationAccess]
      operationId: changeUserApplicationAccess
      summary: 修改用户准入期望状态
      description: >-
        保存期望状态和持久化同步命令；仅显式启用并配置的目标会投递。
        已纳入托管的应用必须收到匹配版本的确认后才允许新登录。
        重新启用已有映射的准入须 confirmPermissionReuse=true。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeApplicationAccessRequest'
      responses:
        '202':
          description: 期望状态已保存；实际确认状态见响应字段，不代表菜单权限已配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/users/{userId}/applications/{appCode}/synchronizations:
    post:
      tags: [ApplicationAccess]
      operationId: retryUserApplicationSynchronization
      summary: 重新安排最新准入版本的失败或待适配同步命令
      description: 仅管理员可操作；不改变准入版本，同一幂等键重试不重复安排。全部响应 no-store。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedVersion]
              properties:
                expectedVersion:
                  type: integer
                  minimum: 1
                  maximum: 9007199254740991
      responses:
        '202':
          description: 已安排同步，尚不代表应用已确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationAccessResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/users/{userId}/applications/{appCode}/menu-permissions:
    get:
      tags: [ApplicationAccess]
      operationId: getUserApplicationMenuPermissions
      summary: 查询已准入用户在目标应用中的菜单权限
      description: >-
        仅管理员可调用。用户准入、应用同步、本地身份映射和 menu_permission_v1 capability
        均有效时，Account 才会调用应用 Provider；Account 不保存菜单明细。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AppCode'
      responses:
        '200':
          description: 应用返回的当前权限快照和准入版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPermissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '503':
          description: 应用 Provider 不可用、超时或返回非法响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [ApplicationAccess]
      operationId: replaceUserApplicationMenuPermissions
      summary: 整集替换 Account 在目标应用中托管的菜单权限
      description: >-
        仅管理员可调用；同一 Idempotency-Key 用于 Account 管理 API 和目标 Provider 的安全重试。
        空 selectedCodes 仅清空 Account 托管项，不影响应用原生角色权限。
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/AppCode'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceMenuPermissionRequest'
      responses:
        '200':
          description: 应用事务提交后返回的归一化权限快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPermissionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: 授权集合超过协议限制
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          description: 目标应用不支持当前协议版本
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 应用 Provider 不可用、超时或返回非法响应
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi/sso/tickets/exchange:
    post:
      tags: [Integration]
      operationId: exchangeSsoTicket
      summary: 业务系统使用一次性 Code 兑换 Account 用户快照
      parameters:
        - $ref: '#/components/parameters/IntegrationAppCode'
        - $ref: '#/components/parameters/IntegrationTimestamp'
        - $ref: '#/components/parameters/IntegrationNonce'
        - $ref: '#/components/parameters/IntegrationSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SsoTicketExchangeRequest'
      responses:
        '200':
          description: Ticket 已原子消费
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SsoTicketExchangeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /openapi/admin-tickets/verify:
    post:
      tags: [Integration]
      operationId: verifyAdminTicket
      summary: 业务系统验证一次性管理 Ticket
      parameters:
        - $ref: '#/components/parameters/IntegrationAppCode'
        - $ref: '#/components/parameters/IntegrationTimestamp'
        - $ref: '#/components/parameters/IntegrationNonce'
        - $ref: '#/components/parameters/IntegrationSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminTicketVerifyRequest'
      responses:
        '200':
          description: Ticket 已验证并原子消费
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminTicketVerifyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: 分页查询脱敏审计事件
      description: Admin/Auditor 只读；精确筛选；固定按 createdAt desc、id desc 排序，不返回原始 detail。
      security:
        - sessionCookie: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: operatorId
          in: query
          schema: { type: string, maxLength: 64 }
        - name: operationType
          in: query
          schema: { type: string, maxLength: 64 }
        - name: targetType
          in: query
          schema: { type: string, maxLength: 64 }
        - name: targetId
          in: query
          schema: { type: string, maxLength: 128 }
        - name: traceId
          in: query
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: 脱敏事件分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /api/audit-events/{id}:
    get:
      tags: [Audit]
      operationId: getAuditEvent
      summary: 获取脱敏审计事件详情
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        '200':
          description: 只读事件，不返回原始 detail 或票据目标标识
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
  parameters:
    IntegrationAppCode:
      name: X-Account-App-Code
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    IntegrationTimestamp:
      name: X-Account-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    IntegrationNonce:
      name: X-Account-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
    IntegrationSignature:
      name: X-Account-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
      description: 由 GET /api/session 初始化并只保存在前端内存中的同步器 Token
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
      description: 按操作者、方法和规范化资源路径隔离，完成结果至少保留 24 小时
    AppCode:
      name: appCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9-]{0,63}$'
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
  responses:
    Unauthorized:
      description: 未登录或 Session 已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF 校验失败或当前角色没有访问能力
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: 请求字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 账号重复、资源版本冲突或幂等键冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    UserImportPreview:
      type: object
      required: [importId, expiresAt, rowCount, valid, rows]
      properties:
        importId: { type: string, format: uuid }
        expiresAt: { type: string, format: date-time }
        rowCount: { type: integer, minimum: 1, maximum: 1000 }
        valid: { type: boolean }
        rows:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/UserImportRow' }
    UserImportRow:
      type: object
      required: [rowNumber, account, email, name, phone, errors]
      properties:
        rowNumber: { type: integer, minimum: 2, maximum: 1001 }
        account: { type: string }
        email: { type: string }
        name: { type: string }
        phone: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    UserImportResult:
      type: object
      required: [importId, createdCount, items]
      properties:
        importId: { type: string, format: uuid }
        createdCount: { type: integer, minimum: 1, maximum: 1000 }
        items:
          type: array
          items:
            type: object
            required: [rowNumber, userId]
            properties:
              rowNumber: { type: integer }
              userId: { type: string }
    AuditEventResponse:
      type: object
      additionalProperties: false
      required: [id, operatorId, operationType, targetType, targetId, outcome, traceId, createdAt]
      properties:
        id: { type: string }
        operatorId: { type: [string, 'null'] }
        operationType: { type: string }
        targetType: { type: [string, 'null'] }
        targetId:
          type: [string, 'null']
          description: 仅 USER、APPLICATION、USER_APPLICATION 管理目标公开，其他类型隐藏。
        outcome: { type: string, enum: [success, failure, unknown] }
        traceId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AuditEventPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponse'
        page: { type: integer, minimum: 1 }
        size: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, format: int64, minimum: 0 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [account, password]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
    SessionResponse:
      type: object
      additionalProperties: false
      required: [authenticated, user, roles, capabilities, csrfToken]
      properties:
        authenticated:
          type: boolean
        user:
          oneOf:
            - $ref: '#/components/schemas/SessionUser'
            - type: 'null'
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ACCOUNT_ADMIN, ACCOUNT_AUDITOR]
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - 'users:read'
              - 'users:write'
              - 'users:import'
              - 'audit:read'
              - 'applications:read'
              - 'applications:write'
              - 'application-access:read'
              - 'application-access:write'
        csrfToken:
          type: string
          minLength: 32
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, account, name]
      properties:
        id:
          type: string
        account:
          type: string
        name:
          type: string
    UserStatus:
      type: string
      enum: [enabled, disabled]
    UserResponse:
      type: object
      additionalProperties: false
      required: [id, account, email, name, phone, status, version]
      properties:
        id:
          type: string
          maxLength: 64
        account:
          type: string
        email:
          type: string
        name:
          type: string
        phone:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [account, email, name, phone]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          type: string
          minLength: 1
          maxLength: 64
    UpdateUserRequest:
      type: object
      additionalProperties: false
      required: [account, email, name, phone, version]
      properties:
        account:
          type: string
          minLength: 1
          maxLength: 128
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
        name:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          type: string
          minLength: 1
          maxLength: 64
        version:
          type: integer
          format: int64
          minimum: 1
    ChangeUserStatusRequest:
      type: object
      additionalProperties: false
      required: [status, version, reason]
      properties:
        status:
          $ref: '#/components/schemas/UserStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 256
    UserPageResponse:
      type: object
      additionalProperties: false
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
          minimum: 0
    ApplicationStatus:
      type: string
      enum: [enabled, disabled]
    ApplicationProtocolCapability:
      type: string
      enum: [sso, admin_ticket, user_sync, menu_permission_v1]
    ApplicationSecretState:
      type: string
      enum: [active, revoked]
    CreateApplicationRequest:
      type: object
      additionalProperties: false
      required:
        - appCode
        - name
        - entryUrl
        - ssoCallbackUrl
        - permissionIframeUrl
        - notifyBaseUrl
        - protocolCapabilities
      properties:
        appCode:
          type: string
          pattern: '^[a-z][a-z0-9-]{0,63}$'
        name:
          type: string
          minLength: 1
          maxLength: 128
        entryUrl:
          type: string
          format: uri
          maxLength: 512
        ssoCallbackUrl:
          type: string
          format: uri
          maxLength: 512
          description: 精确回调 URI，不接受通配符或 fragment
        permissionIframeUrl:
          type: string
          maxLength: 512
          description: 精确授权页 URI，可包含 {externalUserId} 路径占位符
        notifyBaseUrl:
          type: string
          format: uri
          maxLength: 512
        defaultTenantCode:
          type: [string, 'null']
          maxLength: 64
        protocolCapabilities:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationProtocolCapability'
    UpdateApplicationRequest:
      unevaluatedProperties: false
      allOf:
        - $ref: '#/components/schemas/CreateApplicationFields'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64
              minimum: 1
    CreateApplicationFields:
      type: object
      required:
        - name
        - entryUrl
        - ssoCallbackUrl
        - permissionIframeUrl
        - notifyBaseUrl
        - protocolCapabilities
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        entryUrl:
          type: string
          format: uri
          maxLength: 512
        ssoCallbackUrl:
          type: string
          format: uri
          maxLength: 512
        permissionIframeUrl:
          type: string
          maxLength: 512
        notifyBaseUrl:
          type: string
          format: uri
          maxLength: 512
        defaultTenantCode:
          type: [string, 'null']
          maxLength: 64
        protocolCapabilities:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationProtocolCapability'
    ApplicationResponse:
      type: object
      additionalProperties: false
      required:
        - appCode
        - name
        - entryUrl
        - ssoCallbackUrl
        - permissionIframeUrl
        - notifyBaseUrl
        - defaultTenantCode
        - status
        - version
        - secretVersion
        - secretState
        - protocolCapabilities
      properties:
        appCode:
          type: string
        name:
          type: string
        entryUrl:
          type: string
          format: uri
        ssoCallbackUrl:
          type: string
          format: uri
        permissionIframeUrl:
          type: string
        notifyBaseUrl:
          type: string
          format: uri
        defaultTenantCode:
          type: string
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        secretVersion:
          type: integer
          minimum: 1
        secretState:
          $ref: '#/components/schemas/ApplicationSecretState'
        protocolCapabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApplicationProtocolCapability'
        createdAt:
          type: [string, 'null']
          format: date-time
        updatedAt:
          type: [string, 'null']
          format: date-time
    ApplicationSecretResponse:
      type: object
      additionalProperties: false
      required: [application, secret]
      properties:
        application:
          $ref: '#/components/schemas/ApplicationResponse'
        secret:
          type: string
          minLength: 32
          description: 仅在本次成功响应中显示，不得写入浏览器持久化、日志或截图
    VersionedReasonRequest:
      type: object
      additionalProperties: false
      required: [version, reason]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 256
    ChangeApplicationStatusRequest:
      type: object
      additionalProperties: false
      required: [status, version, reason]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 256
    ChangeApplicationAccessRequest:
      type: object
      additionalProperties: false
      required: [status, version, reason]
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740990
        confirmPermissionReuse:
          type: boolean
          default: false
          description: 明确确认重新启用可能复用应用已有的菜单及数据权限
        reason:
          type: string
          minLength: 1
          maxLength: 256
    ApplicationAccessResponse:
      type: object
      additionalProperties: false
      required:
        - userId
        - appCode
        - applicationName
        - applicationStatus
        - protocolCapabilities
        - desiredStatus
        - version
        - integrationStatus
        - retryable
      properties:
        userId:
          type: string
        appCode:
          type: string
        applicationName:
          type: string
        applicationStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        protocolCapabilities:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationProtocolCapability'
        desiredStatus:
          $ref: '#/components/schemas/ApplicationStatus'
        version:
          type: integer
          format: int64
          minimum: 0
        integrationStatus:
          type: string
          enum: [pending_application_adaptation, pending, processing, retry_wait, succeeded, failed, superseded, expired]
        appliedStatus:
          type: [string, 'null']
          enum: [enabled, disabled, null]
        appliedVersion:
          type: [integer, 'null']
          minimum: 1
          maximum: 9007199254740991
        lastSyncedAt:
          type: [string, 'null']
          format: date-time
        lastErrorCode:
          type: [string, 'null']
          description: 稳定错误码，不含内部异常或用户资料
        retryable:
          type: boolean
        syncCommandId:
          type: [string, 'null']
        updatedAt:
          type: [string, 'null']
          format: date-time
    ReplaceMenuPermissionRequest:
      type: object
      additionalProperties: false
      required: [expectedAccessVersion, expectedCatalogRevision, expectedPermissionRevision, selectedCodes]
      properties:
        expectedAccessVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        expectedCatalogRevision:
          type: string
          minLength: 1
          maxLength: 256
        expectedPermissionRevision:
          type: string
          minLength: 1
          maxLength: 256
        selectedCodes:
          type: array
          maxItems: 5000
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[\x21-\x7E]+$'
    MenuPermissionResponse:
      type: object
      additionalProperties: false
      required: [accessVersion, catalogRevision, permissionRevision, assignmentMode, nodes, selectedCodes, inheritedCodes]
      properties:
        accessVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        catalogRevision:
          type: string
          minLength: 1
          maxLength: 256
        permissionRevision:
          type: string
          minLength: 1
          maxLength: 256
        assignmentMode:
          type: string
          const: ADDITIVE
        nodes:
          type: array
          maxItems: 10000
          items:
            $ref: '#/components/schemas/MenuPermissionNode'
        selectedCodes:
          type: array
          maxItems: 5000
          uniqueItems: true
          items:
            type: string
        inheritedCodes:
          type: array
          maxItems: 10000
          uniqueItems: true
          items:
            type: string
    MenuPermissionNode:
      type: object
      additionalProperties: false
      required: [code, nodeType, defaultName, localizedNames, assignable, sort]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        parentCode:
          type: [string, 'null']
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        nodeType:
          type: string
          enum: [GROUP, MENU, ACTION]
        defaultName:
          type: string
          minLength: 1
          maxLength: 256
        localizedNames:
          type: object
          maxProperties: 16
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
        assignable:
          type: boolean
        sort:
          type: integer
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, traceId]
      properties:
        code:
          type: string
          examples: [AUTHENTICATION_REQUIRED]
        message:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    SsoTicketExchangeRequest:
      type: object
      additionalProperties: false
      required: [appCode, code]
      properties:
        appCode:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
    SsoTicketExchangeResponse:
      type: object
      additionalProperties: false
      required: [externalUserId, account, name, tenantCode]
      properties:
        externalUserId:
          type: string
        account:
          type: string
        email:
          type: [string, 'null']
        name:
          type: string
        phone:
          type: [string, 'null']
        tenantCode:
          type: string
    AdminTicketVerifyRequest:
      type: object
