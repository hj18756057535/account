openapi: 3.1.0
info:
  title: Account Application Integration API
  version: 0.1.0
  description: >-
    业务系统作为 Provider 暴露给 Account Center 的用户期望状态接口。
    HMAC 签名原文为 method、path、timestamp、nonce、body 按换行连接。
    可选 Accept-Language 控制 Starter 错误 message 的中英展示，支持 zh/en 地区变体和权重；
    缺失、不支持或非法头回退 zh-CN，响应含 Content-Language 和 Vary: Accept-Language。
    code、traceId、状态值与业务数据不翻译，语言头不改变签名或幂等语义；未知错误使用通用本地化提示。
servers:
  - url: /
tags:
  - name: Account User Sync
  - name: Account Menu Permission
paths:
  /account-integration/users/{globalUserId}:
    put:
      tags: [Account User Sync]
      operationId: applyAccountUserDesiredState
      summary: 幂等应用 Account 用户期望状态
      description: >-
        托管同步要求提供方在同一数据库事务中保存身份绑定、已应用版本及幂等结果。
        相同幂等键必须校验相同请求并重放既有结果；同版本不同请求和过时版本拒绝为 409。
        Account 仅接收与命令完全相同的应用、用户、状态和版本，禁止使用更大版本代替确认。
        Starter 内存 Guard 不是持久化保证，真实业务 Handler 必须自行实现跨重启和多实例幂等。
        旧接入仍保留原兼容语义；以下托管约束不表示自动迁移旧客户端。
      parameters:
        - name: globalUserId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Account-App-Code
          in: header
          required: true
          schema:
            type: string
            minLength: 1
        - name: X-Account-Timestamp
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9]+$'
        - name: X-Account-Nonce
          in: header
          required: true
          schema:
            type: string
            minLength: 16
        - name: X-Account-Signature
          in: header
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUserDesiredState'
      responses:
        '200':
          description: 期望状态已应用，或相同幂等键的既有结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUserSyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '502':
          $ref: '#/components/responses/DependencyUnavailable'
  /account-integration/v1/menu-permissions/query:
    post:
      tags: [Account Menu Permission]
      operationId: queryAccountMenuPermissions
      summary: 查询应用菜单目录及用户当前权限
      description: >-
        仅供 Account Server 调用。返回应用的稳定菜单目录、Account 托管选择、
        应用其他授权来源带来的只读继承权限，以及不透明目录/权限修订号。
      parameters:
        - $ref: '#/components/parameters/AppCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/NonceHeader'
        - $ref: '#/components/parameters/SignatureHeader'
        - $ref: '#/components/parameters/ProtocolVersionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuPermissionQuery'
      responses:
        '200':
          description: 当前应用目录与用户权限快照
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPermissionSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SubjectNotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/ProtocolVersionUnsupported'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /account-integration/v1/menu-permissions:
    put:
      tags: [Account Menu Permission]
      operationId: replaceAccountMenuPermissions
      summary: 整集替换 Account 托管的用户菜单权限
      description: >-
        只替换 Account 托管权限，不删除应用原生角色权限。应用必须校验目录和权限修订号，
        按 Idempotency-Key 保存并重放首次成功结果，并返回应用归一化后的完整权限快照。
      parameters:
        - $ref: '#/components/parameters/AppCodeHeader'
        - $ref: '#/components/parameters/TimestampHeader'
        - $ref: '#/components/parameters/NonceHeader'
        - $ref: '#/components/parameters/SignatureHeader'
        - $ref: '#/components/parameters/ProtocolVersionHeader'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuPermissionReplaceCommand'
      responses:
        '200':
          description: 归一化后的完整权限快照或相同幂等请求的首次成功结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuPermissionSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/SubjectNotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '426':
          $ref: '#/components/responses/ProtocolVersionUnsupported'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
components:
  parameters:
    AppCodeHeader:
      name: X-Account-App-Code
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    TimestampHeader:
      name: X-Account-Timestamp
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9]+$'
    NonceHeader:
      name: X-Account-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    SignatureHeader:
      name: X-Account-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    ProtocolVersionHeader:
      name: X-Account-Protocol-Version
      in: header
      required: true
      schema:
        type: string
        const: menu_permission_v1
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[\x20-\x7E]+$'
  responses:
    Unauthorized:
      description: HMAC、时间窗或 Nonce 校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: syncVersion 已落后或与既有状态冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: 字段或状态值不符合契约
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DependencyUnavailable:
      description: 业务 Handler 返回了不可采用的结果
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SubjectNotFound:
      description: 应用本地用户不存在或 Account 身份映射已失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 请求或响应中的节点、授权集合超过协议上限
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProtocolVersionUnsupported:
      description: 请求头或请求体协议版本不受支持或二者不一致
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: 菜单权限 Handler 未配置、超时或暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    MenuPermissionQuery:
      type: object
      additionalProperties: false
      required: [protocolVersion, appCode, globalUserId, localUserId, account, locale]
      properties:
        protocolVersion:
          type: string
          const: menu_permission_v1
        appCode:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        globalUserId:
          type: string
          minLength: 1
          maxLength: 128
        localUserId:
          type: string
          minLength: 1
          maxLength: 128
        account:
          type: string
          minLength: 1
          maxLength: 128
        locale:
          type: string
          minLength: 2
          maxLength: 32
    MenuPermissionReplaceCommand:
      type: object
      additionalProperties: false
      required:
        - protocolVersion
        - appCode
        - globalUserId
        - localUserId
        - account
        - locale
        - expectedCatalogRevision
        - expectedPermissionRevision
        - selectedCodes
      properties:
        protocolVersion:
          type: string
          const: menu_permission_v1
        appCode:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[\x21-\x7E]+$'
        globalUserId:
          type: string
          minLength: 1
          maxLength: 128
        localUserId:
          type: string
          minLength: 1
          maxLength: 128
        account:
          type: string
          minLength: 1
          maxLength: 128
        locale:
          type: string
          minLength: 2
          maxLength: 32
        expectedCatalogRevision:
          type: string
          minLength: 1
          maxLength: 256
        expectedPermissionRevision:
          type: string
          minLength: 1
          maxLength: 256
        selectedCodes:
          type: array
          maxItems: 5000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MenuPermissionCode'
    MenuPermissionSnapshot:
      type: object
      additionalProperties: false
      required:
        - catalogRevision
        - permissionRevision
        - assignmentMode
        - nodes
        - selectedCodes
        - inheritedCodes
      properties:
        catalogRevision:
          type: string
          minLength: 1
          maxLength: 256
        permissionRevision:
          type: string
          minLength: 1
          maxLength: 256
        assignmentMode:
          type: string
          const: ADDITIVE
        nodes:
          type: array
          maxItems: 10000
          description: 按 sort、code 稳定排序的平铺目录；空目录返回空数组。
          items:
            $ref: '#/components/schemas/MenuPermissionNode'
        selectedCodes:
          type: array
          maxItems: 5000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MenuPermissionCode'
        inheritedCodes:
          type: array
          maxItems: 10000
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MenuPermissionCode'
    MenuPermissionNode:
      type: object
      additionalProperties: false
      required: [code, nodeType, defaultName, localizedNames, assignable, sort]
      properties:
        code:
          $ref: '#/components/schemas/MenuPermissionCode'
        parentCode:
          oneOf:
            - $ref: '#/components/schemas/MenuPermissionCode'
            - type: 'null'
        nodeType:
          type: string
          enum: [GROUP, MENU, ACTION]
        defaultName:
          type: string
          minLength: 1
          maxLength: 256
        localizedNames:
          type: object
          maxProperties: 16
          propertyNames:
            minLength: 2
            maxLength: 32
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 256
        assignable:
          type: boolean
        sort:
          type: integer
          format: int32
    MenuPermissionCode:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[\x21-\x7E]+$'
    AccountUserDesiredState:
      type: object
      additionalProperties: false
      required:
        - appCode
        - globalUserId
        - account
        - displayName
        - tenantCode
        - desiredStatus
        - syncVersion
        - occurredAt
      properties:
        appCode:
          type: string
          minLength: 1
        globalUserId:
          type: string
          minLength: 1
        localUserId:
          type: [string, 'null']
          maxLength: 255
          description: 已确认的应用本地身份；为空时由应用明确创建，不按账号自动合并。
        account:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        email:
          type: [string, 'null']
          format: email
        phone:
          type: [string, 'null']
        tenantCode:
          type: string
          minLength: 1
        desiredStatus:
          type: string
          enum: [enabled, disabled]
        syncVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
        occurredAt:
          type: string
          format: date-time
    AccountUserSyncResult:
      type: object
      additionalProperties: false
      required: [appCode, globalUserId, localUserId, appliedStatus, appliedVersion, resultCode]
      properties:
        appCode:
          type: string
        globalUserId:
          type: string
        localUserId:
          type: string
          minLength: 1
          maxLength: 255
        appliedStatus:
          type: string
          enum: [enabled, disabled]
        appliedVersion:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: 托管同步必须等于本次 syncVersion，不接受更高版本代替回执。
        resultCode:
          type: string
          examples: [APPLIED]
          description: 托管同步仅接受 APPLIED 或 ALREADY_APPLIED；旧接入由原消费者解释。
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, traceId, fieldErrors]
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        fieldErrors:
          type: array
          items:
            type: string
